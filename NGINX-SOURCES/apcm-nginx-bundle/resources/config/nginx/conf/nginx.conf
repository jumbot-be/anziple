#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
	##
        # Basic Settings
        ##
        sendfile on;

        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        include       mime.types;
        default_type application/octet-stream;

        # set the Server output header
        server_tokens off;

	      ##
        # SSL Settings for HTTPS (sensor socket has it's own configuration)
        ##

        ssl_dhparam @nginx.home.directory@/ffdhe2048.txt;

        #modern config https://ssl-config.mozilla.org/#server=nginx&version=1.28.0&config=modern&openssl=3.4.0&hsts=false&ocsp=false&guideline=5.7
        ssl_protocols TLSv1.3;

        #intermediate config for customer using legacy browser  https://ssl-config.mozilla.org/#server=nginx&version=1.28.0&config=intermediate&openssl=3.4.0&hsts=false&ocsp=false&guideline=5.7
        #use only if needed
        #ssl_protocols TLSv1.2 TLSv1.3;
        #ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

        ssl_ecdh_curve X25519:prime256v1:secp384r1;
        ssl_prefer_server_ciphers off;

        ssl_session_timeout 1h;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        resolver 8.8.8.8 7.7.7.7 ipv6=off;	
		
        # Disable gzip to avoid TLS attack vector
        gzip off;
        gzip_vary off;
		
        # ETAG
        etag off;
        
        ##
        # To allow larger uploads
        ##

        client_max_body_size 16M;

        #to read external configuration.
        include "@nginx.home.directory@/sites-enabled/*.conf";
}

# Required for stream proxy (APX sensors with TLS)
include "@nginx.home.directory@/tcpconf.d/*.conf";
