---
- name: Download Nginx bundle
  ansible.builtin.include_role:
    name: integrity
  vars:
    integrity_artifact_url: "{{ artifacts.get('nginx', {}).get('url', '') }}"
    integrity_artifact_dest: "{{ nginx_bundle_dest | default('') }}"
    integrity_artifact_checksum: "{{ artifacts.get('nginx', {}).get('checksum', '') }}"
    integrity_validate_certs: "{{ artifacts.get('nginx', {}).get('validate_certs', true) }}"
    integrity_force_os: "{{ ansible_facts.get('os_family', 'Linux') }}"
  when: artifacts is defined and artifacts.get('nginx') is defined

- name: Create versioned directory (Linux)
  ansible.builtin.file:
    path: "{{ nginx_extract_path }}"
    state: directory
    mode: '0755'

- name: Extract Nginx bundle (Linux)
  ansible.builtin.unarchive:
    src: "{{ nginx_bundle_dest }}"
    dest: "{{ nginx_extract_path }}"
    remote_src: true

- name: Ensure shell scripts are executable (Linux)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0755'
  loop: "{{ query('ansible.builtin.fileglob', nginx_actual_path + '/*.sh') }}"

- name: Create profiles/ansible directory
  ansible.builtin.file:
    path: "{{ nginx_actual_path }}{{ nginx_sep }}profiles{{ nginx_sep }}ansible"
    state: directory
    mode: '0755'

- name: Create .gnupg directory
  ansible.builtin.file:
    path: "/root/.gnupg"
    state: directory
    mode: '0750'

- name: Template config.properties
  ansible.builtin.template:
    src: config.properties.j2
    dest: "{{ nginx_actual_path }}{{ nginx_sep }}profiles{{ nginx_sep }}ansible{{ nginx_sep }}config.properties"
    mode: '0644'

- name: Run prepare-config.sh (Linux)
  ansible.builtin.command:
    cmd: "./prepare-config.sh ansible"
    chdir: "{{ nginx_actual_path }}"
  environment:
    JAVA_HOME: "{{ common_java_home | default('') }}"
    PATH: "{{ common_java_home | default('') }}/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: true

- name: Create Nginx symbolic link (Linux)
  ansible.builtin.file:
    src: "{{ nginx_actual_path }}{{ nginx_sep }}nginx"
    dest: "{{ nginx_symlink_path_linux }}"
    state: link
    force: true

- name: Find mandatory scripts
  ansible.builtin.find:
    paths: "{{ nginx_actual_path }}"
    patterns: "[1-9]*-nginx-bundle--*.sh"
  register: nginx_mandatory_scripts

- name: Run mandatory scripts (Linux)
  ansible.builtin.command:
    cmd: "./{{ item.path | basename }}"
    chdir: "{{ nginx_actual_path }}"
  environment:
    JAVA_HOME: "{{ common_java_home | default('') }}"
    PATH: "{{ common_java_home | default('') }}/bin:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ nginx_mandatory_scripts.files | sort(attribute='path') }}"
  changed_when: true

- name: Find service installation scripts
  ansible.builtin.find:
    paths: "{{ nginx_actual_path }}"
    patterns: "*-nginx--*.sh"
  register: nginx_service_scripts

# - name: Run service installation (Linux)
#   ansible.builtin.command:
#     cmd: "./{{ item.path | basename }}"
#     chdir: "{{ nginx_actual_path }}"
#   loop: "{{ nginx_service_scripts.files }}"
#   when: nginx_service_scripts.files | length > 0
#   changed_when: true

- name: Verify Nginx extraction
  ansible.builtin.stat:
    path: "{{ nginx_actual_path }}/nginx"
  register: nginx_verify_stat

# - name: Assert Nginx is present
#   ansible.builtin.assert:
#     that:
#       - nginx_verify_stat.stat.exists
#     msg: "Nginx not found at {{ nginx_actual_path }}/nginx"

- name: Start and enable Nginx service (Linux)
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  failed_when: false

