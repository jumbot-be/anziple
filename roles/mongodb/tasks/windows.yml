---
- name: Install MongoDB (Windows)
  block:
    - name: Ensure MongoDB install directory exists
      ansible.windows.win_file:
        path: 'C:\adr\MongoDB'
        state: directory

    - name: Copy MongoDB MSI to target
      ansible.windows.win_copy:
        src: "{{ artifacts.mongodb_windows.url }}"
        dest: "{{ ansible_facts['env']['TEMP'] }}\\{{ artifacts.mongodb_windows.name }}"

    - name: Install MongoDB via MSI
      ansible.windows.win_package:
        path: "{{ ansible_facts['env']['TEMP'] }}\\{{ artifacts.mongodb_windows.name }}"
        state: present
        arguments:
          - /quiet
          - /qn
          - /norestart
          - ALLUSERS=1
          - INSTALLLOCATION=C:\adr\MongoDB
          - ADDLOCAL=Server,Client,MonitoringTools,ImportExportTools,MiscTools
          - SHOULD_INSTALL_COMPASS=0

- name: Generate SSL certificate (Windows)
  ansible.windows.win_shell: |
    $env:MSYS_NO_PATHCONV=1
    openssl req -newkey rsa:2048 -new -x509 -days 3650 -nodes `
    -subj "{{ mongodb_cert_subj }}" `
    -out mongodb-cert.crt -keyout mongodb-cert.key
    Get-Content mongodb-cert.key, mongodb-cert.crt | Set-Content "{{ mongodb_pem_path }}"
    Remove-Item mongodb-cert.key, mongodb-cert.crt
  args:
    creates: "{{ mongodb_pem_path }}"

- name: Ensure MongoDB is started for user creation (Windows)
  ansible.windows.win_service:
    name: MongoDB
    state: started
    start_mode: auto

- name: Wait for MongoDB to accept connections (Windows)
  ansible.windows.win_wait_for:
    host: 127.0.0.1
    port: 27017
    timeout: 120

- name: Detect whether mongod currently requires TLS (Windows)
  ansible.windows.win_shell: |
    if (& "C:\adr\MongoDB\bin\mongosh.exe" --quiet --port 27017 --eval 'db.runCommand({ping: 1}') { "plain" }
      elseif (& "C:\adr\MongoDB\bin\mongosh.exe" --quiet --port 27017 --tls --tlsAllowInvalidCertificates --eval 'db.runCommand({ping: 1}') { "tls" }
      else { "unreachable" }
  register: mongodb_tls_mode_win
  changed_when: false
  failed_when: mongodb_tls_mode_win.stdout | trim not in ['plain', 'tls']

- name: Check whether the admin user already exists (no-auth bootstrap Windows)
  ansible.windows.win_shell: |
    $tls = if ("{{ mongodb_tls_mode_win.stdout | trim }}" -eq "tls") { "--tls --tlsAllowInvalidCertificates" } else { "" }
    & "C:\adr\MongoDB\bin\mongosh.exe" --quiet --port 27017 $tls --eval 'print(db.getSiblingDB("admin").getUser("{{ mongodb_admin_user }}") === null ? "MISSING" : "EXISTS")'
  register: mongodb_admin_user_check_win
  changed_when: false
  failed_when: >-
    mongodb_admin_user_check_win.rc != 0
    and not ((mongodb_admin_user_check_win.stderr | default('')) ~ (mongodb_admin_user_check_win.stdout | default(''))) is search('requires authentication|authentication failed')

- name: Create admin user (no-auth bootstrap Windows)
  ansible.windows.win_shell: |
    $tls = if ("{{ mongodb_tls_mode_win.stdout | trim }}" -eq "tls") { "--tls --tlsAllowInvalidCertificates" } else { "" }
    & "C:\adr\MongoDB\bin\mongosh.exe" --quiet --port 27017 $tls --eval 'db.getSiblingDB("admin").createUser({user: "{{ mongodb_admin_user }}", pwd: "{{ mongodb_admin_password }}", roles: [{role: "root", db: "admin"}]})'
  register: mongodb_user_creation_win
  when: "'MISSING' in (mongodb_admin_user_check_win.stdout | default(''))"
  changed_when: mongodb_user_creation_win.rc == 0
  failed_when: mongodb_user_creation_win.rc != 0

- name: Configure MongoDB with Authorization and TLS
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: "{{ mongodb_conf_path }}"
  notify: Restart MongoDB

- name: Flush handlers to apply security configuration
  ansible.builtin.meta: flush_handlers

- name: Wait for MongoDB to accept connections after restart (Windows)
  ansible.windows.win_wait_for:
    host: 127.0.0.1
    port: 27017
    timeout: 120

- name: Verify connection without credentials must fail (Windows)
  ansible.windows.win_shell: |
    $out = & "C:\adr\MongoDB\bin\mongosh.exe" --quiet --port 27017 --tls --tlsAllowInvalidCertificates --eval 'db.getSiblingDB("admin").runCommand({listDatabases: 1})' 2>&1 | Out-String
    Write-Output $out
    if ($out -match 'requires authentication|Unauthorized') { "AUTH_ENFORCED" }
    else { "AUTH_NOT_ENFORCED"; exit 1 }
  register: mongodb_auth_test_win
  failed_when: mongodb_auth_test_win.rc != 0 or 'AUTH_NOT_ENFORCED' in mongodb_auth_test_win.stdout
  changed_when: false

- name: Configure Logrotation (Windows)
  block:
    - name: Ensure scripts directory exists
      ansible.windows.win_file:
        path: 'C:\adr\scripts'
        state: directory

    - name: Deploy MongoDB log rotation script
      ansible.builtin.template:
        src: mongodb_logrotate.ps1.j2
        dest: 'C:\adr\scripts\mongodb_logrotate.ps1'

    - name: Schedule MongoDB log rotation task
      community.windows.win_scheduled_task:
        name: MongoDBLogRotation
        description: "Rotates MongoDB logs daily"
        actions:
          - path: powershell.exe
            arguments: "-ExecutionPolicy Bypass -File C:\\adr\\scripts\\mongodb_logrotate.ps1"
        triggers:
          - type: daily
            start_boundary: '2023-01-01T00:00:00'
        username: SYSTEM
        state: present
