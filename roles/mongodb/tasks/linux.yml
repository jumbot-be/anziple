---
- name: Install MongoDB (Linux)
  block:
    - name: Install dependencies (gnupg, curl)
      ansible.builtin.apt:
        name:
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Download MongoDB GPG key
      ansible.builtin.shell: |
        curl -k https://pgp.mongodb.com/server-8.0.asc -o /tmp/mongodb-server-8.0.asc
        chmod 0644 /tmp/mongodb-server-8.0.asc
      args:
        executable: /bin/bash
        creates: /tmp/mongodb-server-8.0.asc
      register: mongodb_gpg_key_download

    - name: Dearmor MongoDB GPG key
      ansible.builtin.shell: |
        set -o pipefail
        cat /tmp/mongodb-server-8.0.asc | gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/mongodb-server-8.0.gpg
      when: mongodb_gpg_key_download is succeeded

    - name: Create MongoDB list file
      ansible.builtin.copy:
        content: "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg trusted=yes ] {{ mongo_source_url }} multiverse"
        dest: /etc/apt/sources.list.d/mongodb-org-8.0.list
        mode: '0644'

    - name: Install MongoDB packages
      ansible.builtin.apt:
        name:
          - mongodb-org
        state: present
        update_cache: true

- name: Hold kernel packages to avoid mongod incompatibility (Linux)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - mongodb_kernel_hold_enabled | bool
  block:
    - name: Query installed packages (Linux)
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - '-f=${binary:Package}\n'
      register: mongodb_installed_packages
      changed_when: false

    - name: Query residual-config kernel packages (Linux)
      ansible.builtin.shell: |
        dpkg -l | awk '/^rc/ {print $2}' | grep -E '{{ mongodb_kernel_incompatible_pattern }}' || true
      args:
        executable: /bin/bash
      register: mongodb_residual_kernel_packages
      changed_when: false

    - name: Purge residual-config incompatible kernel packages (Linux)
      ansible.builtin.apt:
        name: "{{ mongodb_residual_kernel_packages.stdout_lines }}"
        state: absent
        purge: true
      when: mongodb_residual_kernel_packages.stdout_lines | length > 0

    - name: Compute installed incompatible kernel packages (Linux)
      ansible.builtin.set_fact:
        mongodb_incompatible_kernel_packages: "{{ mongodb_installed_packages.stdout_lines
                                              | select('match', mongodb_kernel_incompatible_pattern) | list }}"

    - name: Remove incompatible kernel packages (Linux)
      ansible.builtin.apt:
        name: "{{ mongodb_incompatible_kernel_packages }}"
        state: absent
      when: mongodb_incompatible_kernel_packages | length > 0

    - name: Refresh installed package list after kernel cleanup (Linux)
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - '-f=${binary:Package}\n'
      register: mongodb_installed_packages_refresh
      changed_when: false
      when: mongodb_incompatible_kernel_packages | length > 0

    - name: Use refreshed package list (Linux)
      ansible.builtin.set_fact:
        mongodb_installed_package_names: "{{ mongodb_installed_packages_refresh.stdout_lines
                                            if (mongodb_incompatible_kernel_packages | length > 0)
                                            else mongodb_installed_packages.stdout_lines | default([]) }}"

    - name: List currently held packages (Linux)
      ansible.builtin.command: apt-mark showhold
      register: mongodb_held_packages
      changed_when: false

    - name: Compute kernel packages to hold (Linux)
      ansible.builtin.set_fact:
        mongodb_kernel_packages_to_hold: >-
          {{ ((mongodb_installed_package_names | select('match', mongodb_kernel_versioned_package_pattern) | list)
              + (mongodb_installed_package_names | select('match', mongodb_kernel_meta_package_pattern) | list))
             | difference(mongodb_held_packages.stdout_lines) }}

    - name: Hold kernel packages (Linux)
      ansible.builtin.command:
        argv:
          - apt-mark
          - hold
          - "{{ item }}"
      loop: "{{ mongodb_kernel_packages_to_hold }}"
      changed_when: true

    - name: Verify kernel packages are on hold (Linux)
      ansible.builtin.command: apt-mark showhold
      register: mongodb_kernel_hold_verify
      changed_when: false
      failed_when: mongodb_kernel_packages_to_hold | difference(mongodb_kernel_hold_verify.stdout_lines) | length > 0

- name: Create Log, Data and SSL directories (Linux)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: mongodb
    group: mongodb
    mode: '0755'
  loop:
    - "{{ mongodb_log_dir }}"
    - "/var/lib/mongodb"
    - "/etc/ssl"

- name: Generate SSL certificate (Linux)
  ansible.builtin.shell: |
    openssl req -newkey rsa:2048 -new -x509 -days 3650 -nodes \
    -subj "{{ mongodb_cert_subj }}" \
    -out /tmp/mongodb-cert.crt -keyout /tmp/mongodb-cert.key
    cat /tmp/mongodb-cert.key /tmp/mongodb-cert.crt > {{ mongodb_pem_path }}
    chown mongodb:mongodb {{ mongodb_pem_path }}
    chmod 0600 {{ mongodb_pem_path }}
    rm /tmp/mongodb-cert.key /tmp/mongodb-cert.crt
  args:
    creates: "{{ mongodb_pem_path }}"

- name: Clear systemd failed state for mongod (avoid start-limit-hit)
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - mongod
  changed_when: false
  failed_when: false

- name: Ensure MongoDB is started for user creation (without auth)
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: true

- name: Wait for MongoDB to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 27017
    timeout: 120

- name: Detect whether mongod currently requires TLS
  ansible.builtin.shell: |
    if mongosh --quiet --port 27017 --eval 'db.runCommand({ping: 1})' >/dev/null 2>&1; then
      echo "plain"
    elif mongosh --quiet --port 27017 --tls --tlsAllowInvalidCertificates --eval 'db.runCommand({ping: 1})' >/dev/null 2>&1; then
      echo "tls"
    else
      echo "unreachable"
    fi
  register: mongodb_tls_mode
  changed_when: false
  failed_when: mongodb_tls_mode.stdout != 'plain' and mongodb_tls_mode.stdout != 'tls'

- name: Check whether the admin user already exists (no-auth bootstrap)
  ansible.builtin.shell: |
    mongosh --quiet --port 27017 {{ (mongodb_tls_mode.stdout == 'tls') | ternary('--tls --tlsAllowInvalidCertificates', '') }} --eval 'print(db.getSiblingDB("admin").getUser("{{ mongodb_admin_user }}") === null ? "MISSING" : "EXISTS")'
  register: mongodb_admin_user_check
  changed_when: false
  failed_when: >-
    mongodb_admin_user_check.rc != 0
    and not ((mongodb_admin_user_check.stderr | default('')) ~ (mongodb_admin_user_check.stdout | default(''))) is search('requires authentication|authentication failed')

- name: Create admin user (no-auth bootstrap)
  ansible.builtin.shell: |
    mongosh --quiet --port 27017 {{ (mongodb_tls_mode.stdout == 'tls') | ternary('--tls --tlsAllowInvalidCertificates', '') }} --eval 'db.getSiblingDB("admin").createUser({user: "{{ mongodb_admin_user }}", pwd: "{{ mongodb_admin_password }}", roles: [{role: "root", db: "admin"}]})'
  register: mongodb_user_creation
  when: "'MISSING' in (mongodb_admin_user_check.stdout | default(''))"
  changed_when: mongodb_user_creation.rc == 0
  failed_when: mongodb_user_creation.rc != 0

- name: Set whether authentication is currently active
  ansible.builtin.set_fact:
    mongodb_auth_active: >-
      {{ 'requires authentication' in ((mongodb_admin_user_check.stderr | default('')) ~ (mongodb_admin_user_check.stdout | default(''))) }}
  changed_when: false

- name: Set mongosh connection arguments for app database tasks
  ansible.builtin.set_fact:
    mongodb_tls_args: >-
      {{ (mongodb_tls_mode.stdout == 'tls') | ternary('--tls --tlsAllowInvalidCertificates', '') }}
    mongodb_auth_args: >-
      {{ (mongodb_auth_active | bool) | ternary("-u '" ~ mongodb_admin_user ~ "' -p '" ~ mongodb_admin_password ~ "' --authenticationDatabase admin", '') }}
  changed_when: false

- name: Reset application database (drop and recreate)
  ansible.builtin.shell: |
    mongosh --quiet --port 27017 {{ mongodb_tls_args }} {{ mongodb_auth_args }} --eval 'db = db.getSiblingDB("{{ mongodb_app_db_name }}"); db.dropDatabase(); db.createCollection("{{ mongodb_app_db_name }}");'
  when: mongodb_app_db_reset | bool
  changed_when: true
  register: mongodb_app_db_reset_result
  failed_when: mongodb_app_db_reset_result.rc != 0

- name: Ensure application database and collection exist
  ansible.builtin.shell: |
    mongosh --quiet --port 27017 {{ mongodb_tls_args }} {{ mongodb_auth_args }} --eval 'db = db.getSiblingDB("{{ mongodb_app_db_name }}"); if (!db.getCollectionNames().includes("{{ mongodb_app_db_name }}")) { db.createCollection("{{ mongodb_app_db_name }}"); print("CREATED"); } else { print("EXISTS"); }'
  when: not (mongodb_app_db_reset | bool)
  register: mongodb_app_db_ensure
  changed_when: "'CREATED' in mongodb_app_db_ensure.stdout"
  failed_when: mongodb_app_db_ensure.rc != 0
  when: not (mongodb_app_db_reset | bool)
  register: mongodb_app_db_ensure
  changed_when: "'CREATED' in mongodb_app_db_ensure.stdout"
  failed_when: mongodb_app_db_ensure.rc != 0

- name: Configure MongoDB with Authorization and TLS
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: "{{ mongodb_conf_path }}"
    mode: '0644'
  notify: Restart MongoDB

- name: Create Systemd override (Linux)
  ansible.builtin.file:
    path: /lib/systemd/system/mongod.service.d
    state: directory
    mode: '0755'

- name: Deploy Systemd override file (Linux)
  ansible.builtin.copy:
    content: |
      [Unit]
      StartLimitIntervalSec=1800
      StartLimitBurst=3
      [Service]
      Restart=on-failure
      RestartSec=5s
    dest: /lib/systemd/system/mongod.service.d/override.conf
    mode: '0644'
  notify: Reload Systemd

- name: Configure Logrotate (Linux)
  ansible.builtin.copy:
    content: |
      {{ mongodb_log_dir }}/mongod.log {
        daily
        size 50M
        rotate 10
        missingok
        compress
        delaycompress
        notifempty
        create 640 mongodb mongodb
        sharedscripts
        postrotate
          /bin/kill -SIGUSR1 `systemctl show --property MainPID --value mongod.service` >/dev/null 2>&1
        endscript
      }
    dest: /etc/logrotate.d/mongod
    mode: '0644'

- name: Create MongoDB symbolic link (Linux)
  ansible.builtin.file:
    src: "/var/lib/mongodb"
    dest: "{{ mongodb_symlink_path_linux }}"
    state: link
    force: true

- name: Flush handlers to apply security configuration
  ansible.builtin.meta: flush_handlers

- name: Wait for MongoDB to accept connections after restart
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 27017
    timeout: 120

- name: Verify connection without credentials must fail
  ansible.builtin.shell: |
    set -o pipefail
    out=$(mongosh --quiet --port 27017 --tls --tlsAllowInvalidCertificates --eval 'db.getSiblingDB("admin").runCommand({listDatabases: 1})' 2>&1)
    echo "$out"
    case "$out" in
      *"requires authentication"*|*"Unauthorized"*)
        echo "AUTH_ENFORCED"
        ;;
      *)
        echo "AUTH_NOT_ENFORCED"
        exit 1
        ;;
    esac
  args:
    executable: /bin/bash
  register: mongodb_auth_test
  failed_when: mongodb_auth_test.rc != 0 or 'AUTH_NOT_ENFORCED' in mongodb_auth_test.stdout
  changed_when: false
