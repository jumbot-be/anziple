# MongoDB Configuration Defaults
mongodb_admin_user: "ampacimonAdmin"
mongodb_admin_password: "a very complex password please" # Override in Vault
# MongoDB init scripts (JS) provided by the dev team, executed by
# tasks/config.yml via config_databases.yml with admin credentials.
# Paths on the target host, e.g. bundle resources/mongo/latest/*.js
# (1-create-default-collection.js, 2-create-users-roles.js).
mongodb_init_scripts: []

mongodb_cert_subj: "/C=BE/ST=LIEGE/L=LIEGE/O=Ampacimon/OU=IT/emailAddress=sysadmin@ampacimon.com/CN={{ ansible_facts['fqdn'] }}"

# OS specific paths
mongodb_conf_path_linux: "/etc/mongod.conf"
mongodb_pem_path_linux: "/etc/ssl/mongodb.pem"
mongodb_log_path_linux: "/var/log/mongodb/mongod.log"

mongodb_conf_path_windows: 'C:\adr\MongoDB\bin\mongod.conf'
mongodb_pem_path_windows: 'C:\adr\MongoDB\bin\mongodb.pem'
mongodb_log_path_windows: 'C:\adr\MongoDB\log\mongod.log'
mongodb_bin_path_windows: 'C:\adr\MongoDB\bin'


# until there is a version available to use  {{ ansible_facts['distribution_release'] }}
mongo_source_url: "https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0"

# Kernel hold: mongod is incompatible with kernel 6.19 through 7.0.13 (TCMalloc/rseq),
# so installed kernel packages and meta-packages are held to block any kernel upgrade,
# and already-installed incompatible kernel images are removed.
mongodb_kernel_hold_enabled: true
mongodb_kernel_incompatible_pattern: '^linux-(image|image-unsigned|modules|modules-extra)-(6\.(19|[2-9][0-9])\.[0-9]+|7\.0\.([0-9]|1[0-3]))-[0-9]+'
mongodb_kernel_versioned_package_pattern: '^linux-(image|image-unsigned|headers|modules|modules-extra|buildinfo)-[0-9]+\.[0-9]+'
mongodb_kernel_meta_package_pattern: '^linux-(image-|headers-)?(generic|virtual|aws|azure|gcp|oem|lowlatency)'
