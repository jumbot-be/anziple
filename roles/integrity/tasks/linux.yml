---
- name: Determine if source is local
  ansible.builtin.set_fact:
    integrity_is_local: "{{ integrity_artifact_url and not (integrity_artifact_url.startswith('http://') or integrity_artifact_url.startswith('https://')) }}"

- name: Handle remote artifact (Linux)
  ansible.builtin.get_url:
    url: "{{ integrity_artifact_url }}"
    dest: "{{ integrity_artifact_dest }}"
    checksum: "{{ integrity_artifact_checksum }}"
    mode: '0644'
    validate_certs: "{{ integrity_validate_certs | default(ansible_validate_certs) | default(true) }}"
  when: not integrity_is_local and integrity_artifact_url

- name: Handle local artifact (Linux)
  ansible.builtin.copy:
    src: "{{ integrity_artifact_url }}"
    dest: "{{ integrity_artifact_dest }}"
    mode: '0644'
  when: integrity_is_local and integrity_artifact_url

- name: Verify integrity after copy (Linux)
  ansible.builtin.stat:
    path: "{{ integrity_artifact_dest }}"
    checksum_algorithm: sha256
  register: artifact_stat_linux
  when: integrity_is_local

- name: Fail if integrity check fails (Linux)
  ansible.builtin.fail:
    msg: "Integrity check failed for local artifact {{ integrity_artifact_url }}. Expected {{ integrity_artifact_checksum.split(':')[1] if ':' in integrity_artifact_checksum else integrity_artifact_checksum }}, got {{ artifact_stat_linux.stat.checksum }}"
  when:
    - integrity_is_local
    - artifact_stat_linux.stat.checksum != (integrity_artifact_checksum.split(':')[1] if ':' in integrity_artifact_checksum else integrity_artifact_checksum)
