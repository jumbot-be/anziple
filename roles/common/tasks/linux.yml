---
- name: Ensure base directory exists on Linux
  ansible.builtin.file:
    path: "{{ adr_base_path_linux }}"
    state: directory
    mode: '0755'

- name: Configure system limits (Linux)
  community.general.pam_limits:
    domain: "{{ item.domain }}"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { domain: 'root', type: 'soft', item: 'nofile', value: 65535 }
    - { domain: 'root', type: 'hard', item: 'nofile', value: 65535 }
    - { domain: '*', type: 'soft', item: 'nofile', value: 64000 }
    - { domain: '*', type: 'hard', item: 'nofile', value: 64000 }
    - { domain: '*', type: 'soft', item: 'locks', value: 0 }
    - { domain: '*', type: 'hard', item: 'locks', value: 0 }
    - { domain: '*', type: 'soft', item: 'nproc', value: 64000 }
    - { domain: '*', type: 'hard', item: 'nproc', value: 64000 }

- name: Verify limits.conf (Linux)
  ansible.builtin.command: grep "65535" /etc/security/limits.conf
  register: common_limits_check
  changed_when: false

- name: Configure unattended-upgrades (Linux)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - unattended_upgrades_enabled | bool
  block:
    - name: Install unattended-upgrades (Linux)
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Enable automatic updates via apt timers (Linux)
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'

    - name: Ensure unattended-upgrades service is enabled (Linux)
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true

- name: Setup JDK facts
  ansible.builtin.include_tasks: setup_jdk.yml

- name: Install JDK on Linux
  block:
    - name: Download Zulu JDK for Linux
      ansible.builtin.include_role:
        name: integrity
      vars:
        integrity_artifact_url: "{{ item.artifact.url }}"
        integrity_artifact_dest: "/tmp/{{ item.artifact.name }}"
        integrity_artifact_checksum: "{{ item.artifact.checksum }}"
        integrity_validate_certs: "{{ item.artifact.validate_certs | default(ansible_validate_certs) | default(true) }}"
        integrity_force_os: "{{ ansible_facts.get('os_family', 'Linux') }}"
      loop: "{{ required_jdks }}"

    - name: Check if legacy jdk symlink exists (Linux)
      ansible.builtin.stat:
        path: "{{ adr_base_path_linux }}/jdk"
      register: common_jdk_legacy_stat

    - name: Remove legacy jdk symlink if it's not a directory (Linux)
      ansible.builtin.file:
        path: "{{ adr_base_path_linux }}/jdk"
        state: absent
      when:
        - common_jdk_legacy_stat.stat.exists
        - not common_jdk_legacy_stat.stat.isdir
        - (artifacts[jdk_front_key] is defined or artifacts[jdk_back_key] is defined)

    - name: Ensure JDK parent directory exists (Linux)
      ansible.builtin.file:
        path: "{{ adr_base_path_linux }}/jdk"
        state: directory
        mode: '0755'
      when: (artifacts[jdk_front_key] is defined or artifacts[jdk_back_key] is defined)


    - name: Clean extraction directory
      ansible.builtin.file:
        path: "/tmp/jdk_extract_{{ item.type }}"
        state: absent
      loop: "{{ required_jdks }}"

    - name: Create extraction directory
      ansible.builtin.file:
        path: "/tmp/jdk_extract_{{ item.type }}"
        state: directory
        mode: '0755'
      loop: "{{ required_jdks }}"

    - name: Extract JDK on Linux
      ansible.builtin.unarchive:
        src: "/tmp/{{ item.artifact.name }}"
        dest: "/tmp/jdk_extract_{{ item.type }}"
        remote_src: true
      loop: "{{ required_jdks }}"

    - name: Find JDK directory name (Linux)
      ansible.builtin.find:
        paths: "/tmp/jdk_extract_{{ item.type }}"
        patterns: "zulu*"
        file_type: directory
      loop: "{{ required_jdks }}"
      register: common_jdk_dirs_linux

    - name: Ensure final destination parent directory exists (Linux)
      ansible.builtin.file:
        path: "{{ (adr_base_path_linux + '/' + item.dest_subdir) | dirname }}"
        state: directory
        mode: '0755'
      loop: "{{ required_jdks }}"

    - name: Copy JDK to final destination (Linux)
      ansible.builtin.copy:
        src: "{{ common_jdk_dirs_linux.results[idx].files[0].path }}/"
        dest: "{{ adr_base_path_linux }}/{{ item.dest_subdir }}_actual"
        remote_src: true
        mode: '0755'
      loop: "{{ required_jdks }}"
      loop_control:
        index_var: idx

    - name: Create JDK symbolic link (Linux)
      ansible.builtin.file:
        src: "{{ adr_base_path_linux }}/{{ item.dest_subdir }}_actual"
        dest: "{{ adr_base_path_linux }}/{{ item.dest_subdir }}"
        state: link
        force: true
      loop: "{{ required_jdks }}"

    - name: Cleanup extraction directory
      ansible.builtin.file:
        path: "/tmp/jdk_extract_{{ item.type }}"
        state: absent
      loop: "{{ required_jdks }}"

    - name: Configure JAVA_HOME globally (Linux)
      ansible.builtin.copy:
        content: |
          export JAVA_HOME={{ common_java_home }}
          export PATH=$JAVA_HOME/bin:$PATH
        dest: /etc/profile.d/java.sh
        mode: '0644'

    - name: Add JAVA_HOME to /etc/environment
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: '^JAVA_HOME='
        line: 'JAVA_HOME="{{ common_java_home }}"'
        state: present

    - name: Add JAVA_HOME to /etc/bash.bashrc
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        regexp: '^export JAVA_HOME='
        line: 'export JAVA_HOME="{{ common_java_home }}"'
        state: present

    - name: Add Java to PATH in /etc/bash.bashrc
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        regexp: '^export PATH=.*{{ common_java_home }}/bin'
        line: 'export PATH="{{ common_java_home }}/bin:$PATH"'
        state: present

    - name: Ensure Java binaries are in PATH for current session (Linux)
      ansible.builtin.set_fact:
        common_java_path: "{{ common_java_home }}/bin"

    - name: Verify JAVA_HOME and java executable (Linux)
      ansible.builtin.shell: |
        # Sourcing to ensure the current shell has the updated environment
        . /etc/profile.d/java.sh
        if [ -d "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then
          $JAVA_HOME/bin/java -version
        else
          echo "JAVA_HOME is not correctly set or java executable not found"
          exit 1
        fi
      args:
        executable: /bin/bash
      register: common_java_verify_linux
      changed_when: false
