---
- name: Find versioned directories for {{ component_name }} (Windows)
  ansible.windows.win_find:
    paths: "{{ adr_base_path_windows }}"
    patterns: "{{ component_pattern }}*"
    file_type: directory
  register: component_dirs_win
  when: ansible_facts['os_family'] == 'Windows'

- name: Sort and identify old directories to remove (Windows)
  ansible.builtin.set_fact:
    dirs_to_remove_win: "{{ (component_dirs_win.files | sort(attribute='lastwritetime', reverse=true))[2:] }}"
  when:
    - ansible_facts['os_family'] == 'Windows'
    - component_dirs_win.matched > 2

- name: Remove old versioned directories (Windows)
  ansible.windows.win_file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ dirs_to_remove_win | default([]) }}"
  when: ansible_facts['os_family'] == 'Windows'
