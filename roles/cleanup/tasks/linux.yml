---
- name: Remove known artifact files from /tmp
  ansible.builtin.file:
    path: "/tmp/{{ item.value.name }}"
    state: absent
  loop: "{{ artifacts | dict2items }}"
  when: item.value.name is defined

- name: Remove specific temporary files from /tmp
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - mongodb-server-8.0.asc
    - mongodb-cert.crt
    - mongodb-cert.key

- name: Find all .zip files in installation directory (Linux)
  ansible.builtin.find:
    paths: "{{ adr_base_path_linux }}"
    patterns: "*.zip"
  register: adr_zip_files

- name: Remove all .zip files from installation directory (Linux)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ adr_zip_files.files }}"

- name: Cleanup old versioned directories for Keycloak
  ansible.builtin.include_tasks: cleanup_component.yml
  vars:
    component_name: "Keycloak"
    component_pattern: "apcm-keycloak-bundle"

- name: Cleanup old versioned directories for Nginx
  ansible.builtin.include_tasks: cleanup_component.yml
  vars:
    component_name: "Nginx"
    component_pattern: "apcm-nginx-bundle"

- name: Cleanup old versioned directories for Payara
  ansible.builtin.include_tasks: cleanup_component.yml
  vars:
    component_name: "Payara"
    component_pattern: "apcm-payara-bundle"
