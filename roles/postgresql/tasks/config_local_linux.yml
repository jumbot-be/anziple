---
# Local PostgreSQL provisioning on Linux (run from tasks/config.yml).
# Content moved from the former provisioning block in tasks/linux.yml.
# The super admin is created here (local install only; never on RDS).

- name: Get available locales
  ansible.builtin.command: locale -a
  register: available_locales
  changed_when: false

- name: Set active collation fact
  ansible.builtin.set_fact:
    postgresql_active_collation: >-
      {%- if postgresql_linux_collation in available_locales.stdout_lines -%}
        {{ postgresql_linux_collation }}
      {%- elif postgresql_linux_collation_lower in available_locales.stdout_lines -%}
        {{ postgresql_linux_collation_lower }}
      {%- elif 'en_US.utf8' in available_locales.stdout_lines -%}
        en_US.utf8
      {%- elif 'en_US.UTF-8' in available_locales.stdout_lines -%}
        en_US.UTF-8
      {%- else -%}
        C.UTF-8
      {%- endif -%}

- name: Configure PostgreSQL Users and Databases (local Linux)
  block:
    - name: Create Super Admin User
      community.postgresql.postgresql_user:
        name: "{{ postgresql_admin_user }}"
        password: "{{ postgresql_admin_password }}"
        role_attr_flags: SUPERUSER
        login_user: postgres
      no_log: false

    - name: Create ADR Customer User
      community.postgresql.postgresql_user:
        name: "{{ postgresql_adr_customer_user }}"
        password: "{{ postgresql_adr_customer_password }}"
        login_user: postgres
      no_log: false

    - name: Create ADR Customer Database
      community.postgresql.postgresql_db:
        name: "{{ postgresql_adr_db_name }}"
        owner: "{{ postgresql_adr_customer_user }}"
        encoding: UTF8
        lc_collate: "{{ postgresql_active_collation }}"
        lc_ctype: "{{ postgresql_active_collation }}"
        template: template0
        login_user: postgres

    - name: Create Keycloak User
      community.postgresql.postgresql_user:
        name: "{{ postgresql_keycloak_user }}"
        password: "{{ postgresql_adr_keycloak_password }}"
        login_user: postgres
      no_log: false

    - name: Create Keycloak Database
      community.postgresql.postgresql_db:
        name: "{{ postgresql_keycloak_db_name }}"
        owner: "{{ postgresql_keycloak_user }}"
        encoding: UTF8
        lc_collate: "{{ postgresql_active_collation }}"
        lc_ctype: "{{ postgresql_active_collation }}"
        template: template0
        login_user: postgres
  become: true
  become_user: postgres
