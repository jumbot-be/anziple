---
# RDS/External PostgreSQL tasks (run during deploy).
# Provisioning (users/databases/grants/ownership) has MOVED to
# tasks/config_rds.yml, executed by playbook/config_databases.yml
# via tasks/config.yml. This file now only performs deploy-time checks.
#
# EXCEPTION (RDS): the super admin is never created by this repository:
# it is provisioned by AWS at instance initialization.

- name: Set RDS facts
  ansible.builtin.set_fact:
    postgresql_rds_hostname: "{{ postgresql_rds_hostname | default('') }}"
    postgresql_rds_port: "{{ postgresql_rds_port | default(5432) }}"
  tags: [always]

- name: Check RDS connectivity
  when: postgresql_rds_hostname | trim != ''
  block:
    - name: Wait for PostgreSQL port on RDS
      ansible.builtin.wait_for:
        host: "{{ postgresql_rds_hostname }}"
        port: "{{ postgresql_rds_port }}"
        state: started
        timeout: 30
      when: ansible_facts['os_family'] != 'Windows'

    - name: Set active collation fact
      ansible.builtin.set_fact:
        postgresql_active_collation: >-
          {%- if postgresql_linux_collation in available_locales.stdout_lines -%}
            {{ postgresql_linux_collation }}
          {%- elif postgresql_linux_collation_lower in available_locales.stdout_lines -%}
            {{ postgresql_linux_collation_lower }}
          {%- elif 'en_US.utf8' in available_locales.stdout_lines -%}
            en_US.utf8
          {%- elif 'en_US.UTF-8' in available_locales.stdout_lines -%}
            en_US.UTF-8
          {%- else -%}
            C.UTF-8
          {%- endif -%}
      when: ansible_facts['os_family'] != 'Windows'

    # Step 1: Create users first
    - name: Create Keycloak User on RDS
      community.postgresql.postgresql_user:
        name: "{{ postgresql_keycloak_user }}"
        password: "{{ postgresql_adr_keycloak_password }}"
        state: present
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
      no_log: false

    - name: Create ADR Customer User on RDS
      community.postgresql.postgresql_user:
        name: "{{ postgresql_adr_customer_user }}"
        password: "{{ postgresql_adr_customer_password }}"
        state: present
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
      no_log: false

    # Step 2: Create databases (without owner to avoid SET ROLE error on RDS)
    - name: Create Keycloak Database on RDS
      community.postgresql.postgresql_db:
        name: "{{ postgresql_keycloak_db_name }}"
        encoding: UTF8
        lc_collate: "{{ postgresql_active_collation | default('en_US.UTF-8') }}"
        lc_ctype: "{{ postgresql_active_collation | default('en_US.UTF-8') }}"
        template: template0
        state: present
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
      no_log: false

    - name: Create ADR Customer Database on RDS
      community.postgresql.postgresql_db:
        name: "{{ postgresql_adr_db_name }}"
        encoding: UTF8
        lc_collate: "{{ postgresql_active_collation | default('en_US.UTF-8') }}"
        lc_ctype: "{{ postgresql_active_collation | default('en_US.UTF-8') }}"
        template: template0
        state: present
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
      no_log: false

    # Step 3: Grant all privileges and set ownership
    - name: Grant all privileges on Keycloak database to Keycloak user
      community.postgresql.postgresql_privs:
        database: "{{ postgresql_keycloak_db_name }}"
        roles: "{{ postgresql_keycloak_user }}"
        privs: ALL
        type: database
        state: present
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
      no_log: false

    - name: Set Keycloak user as owner of Keycloak database
      community.postgresql.postgresql_owner:
        db: "{{ postgresql_keycloak_db_name }}"
        obj_name: "{{ postgresql_keycloak_db_name }}"
        obj_type: database
        new_owner: "{{ postgresql_keycloak_user }}"
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
      no_log: false

    - name: Grant all privileges on ADR database to ADR user
      community.postgresql.postgresql_privs:
        database: "{{ postgresql_adr_db_name }}"
        roles: "{{ postgresql_adr_customer_user }}"
        privs: ALL
        type: database
        state: present
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
      no_log: false

    - name: Set ADR user as owner of ADR database
      community.postgresql.postgresql_owner:
        db: "{{ postgresql_adr_db_name }}"
        obj_name: "{{ postgresql_adr_db_name }}"
        obj_type: database
        new_owner: "{{ postgresql_adr_customer_user }}"
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
      no_log: false

    - name: Verify users and databases exist on RDS
      community.postgresql.postgresql_query:
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_rds_admin_user | default(postgresql_admin_user) }}"
        login_password: "{{ postgresql_rds_admin_password | default(postgresql_admin_password) }}"
        db: postgres
        query:
          - SELECT 1 AS ok FROM pg_roles WHERE rolname = '{{ postgresql_keycloak_user }}' AND rolcanlogin
          - SELECT 1 AS ok FROM pg_roles WHERE rolname = '{{ postgresql_adr_customer_user }}' AND rolcanlogin
          - SELECT 1 AS ok FROM pg_database WHERE datname = '{{ postgresql_keycloak_db_name }}'
          - SELECT 1 AS ok FROM pg_database WHERE datname = '{{ postgresql_adr_db_name }}'
          - SELECT pg_roles.rolname AS owner FROM pg_database JOIN pg_roles ON pg_roles.oid = pg_database.datdba WHERE datname = '{{ postgresql_keycloak_db_name }}' AND pg_roles.rolname = '{{ postgresql_keycloak_user }}'
          - SELECT pg_roles.rolname AS owner FROM pg_database JOIN pg_roles ON pg_roles.oid = pg_database.datdba WHERE datname = '{{ postgresql_adr_db_name }}' AND pg_roles.rolname = '{{ postgresql_adr_customer_user }}'
      register: postgresql_rds_object_check
      changed_when: false
      failed_when: >-
        postgresql_rds_object_check.query_all_results[0] | default([]) | length != 1
        or postgresql_rds_object_check.query_all_results[1] | default([]) | length != 1
        or postgresql_rds_object_check.query_all_results[2] | default([]) | length != 1
        or postgresql_rds_object_check.query_all_results[3] | default([]) | length != 1
        or postgresql_rds_object_check.query_all_results[4] | default([]) | length != 1
        or postgresql_rds_object_check.query_all_results[5] | default([]) | length != 1

    - name: Verify the ADR user can authenticate on RDS with its password
      community.postgresql.postgresql_ping:
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_adr_customer_user }}"
        login_password: "{{ postgresql_adr_customer_password }}"
        db: "{{ postgresql_adr_db_name }}"
      register: postgresql_rds_adr_login_check
      changed_when: false

    - name: Verify the Keycloak user can authenticate on RDS with its password
      community.postgresql.postgresql_ping:
        login_host: "{{ postgresql_rds_hostname }}"
        login_port: "{{ postgresql_rds_port }}"
        login_user: "{{ postgresql_keycloak_user }}"
        login_password: "{{ postgresql_adr_keycloak_password }}"
        db: "{{ postgresql_keycloak_db_name }}"
      register: postgresql_rds_keycloak_login_check
      changed_when: false
