---
- name: Get current Keycloak version from version.txt
  slurp:
    src: /opt/keycloak/version.txt
  register: version_file
  ignore_errors: yes

- name: Extract current version
  set_fact:
    current_version: "{{ version_file.content | b64decode | trim }}"
  when: version_file is success

- name: Get current version via kc.sh if version.txt not found
  command: /opt/keycloak/bin/kc.sh --version
  register: kc_version
  when: version_file is failed

- name: Extract version from kc.sh output
  set_fact:
    current_version: "{{ kc_version.stdout | regex_replace('Keycloak (\\d+\\.\\d+\\.\\d+)', '\\1') }}"
  when: version_file is failed

- name: Stop Keycloak
  systemd:
    name: keycloak
    state: stopped

- name: Create backup directory
  file:
    path: /opt/keycloak-{{ current_version }}
    state: directory

- name: Backup full Keycloak directory
  copy:
    src: /opt/keycloak/
    dest: /opt/keycloak-{{ current_version }}/
    remote_src: yes

- name: Dump RDS database with pg_dump
  command: >
    pg_dump -h {{ rds_endpoint }} -p 5432 -U {{ rds_username }} -d {{ rds_db_name }}
    --format=plain --file=/opt/keycloak-{{ current_version }}/db-dump/keycloak-db-{{ current_version }}.sql
  environment:
    PGPASSWORD: "{{ rds_password }}"

- name: Download new version from S3
  aws_s3:
    bucket: your-redhat-bucket
    object: keycloak/{{ new_version }}/keycloak-{{ new_version }}.tar.gz
    dest: /tmp/keycloak-{{ new_version }}.tar.gz
    mode: get

- name: Verify downloaded file integrity
  stat:
    path: /tmp/keycloak-{{ new_version }}.tar.gz
  register: downloaded_file
  failed_when: downloaded_file.stat.size == 0

- name: Extract new version to versions directory
  unarchive:
    src: /tmp/keycloak-{{ new_version }}.tar.gz
    dest: /opt/keycloak-{{ new_version }}/
    remote_src: yes
    extra_opts: ["--strip-components=1"]

- name: Copy previous configuration files to new version
  copy:
    src: /opt/keycloak-{{ current_version }}/standalone/configuration/
    dest: /opt/keycloak-{{ new_version }}/standalone/configuration/
    remote_src: yes

- name: Update symlink to new version
  file:
    src: /opt/keycloak-{{ new_version }}
    dest: /opt/keycloak
    state: link
    force: yes

- name: Start Keycloak
  systemd:
    name: keycloak
    state: started

- name: Verify Keycloak health
  uri:
    url: http://localhost:8080/health/ready
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 10
  delay: 10

- name: List existing backups
  find:
    paths: /opt/keycloak-
    file_type: directory
  register: backups

- name: Remove backups older than 3 versions
  file:
    path: /opt/keycloak-{{ item }}
    state: absent
  loop: "{{ backups.files | map(attribute='path') | map('basename') | sort | reverse | list[3:] }}"
  when: backups.files | length > 3