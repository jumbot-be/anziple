---
- name: Set facts for Payara
  ansible.builtin.set_fact:
    payara_type: "{{ payara_type | default('all') }}"
    payara_symlink_path: "{{ (ansible_facts['os_family'] == 'Windows') | ternary(payara_symlink_path_windows, payara_symlink_path_linux) }}"
    payara_base_path: "{{ (ansible_facts['os_family'] == 'Windows') | ternary(adr_base_path_windows, adr_base_path_linux) }}"
    payara_sep: '{{ (ansible_facts["os_family"] == "Windows") | ternary("\\", "/") }}'
  tags: [always]

- name: Set path facts for Payara
  ansible.builtin.set_fact:
    payara_bundle_dest: "{{ payara_base_path }}{{ payara_sep }}{{ artifacts.get('payara', {}).get('name', '') }}"
    payara_version_dir: "{{ artifacts.get('payara', {}).get('name', '') | regex_replace('\\.zip$', '') }}"
  when: artifacts is defined and artifacts.get('payara') is defined
  tags: [always]

- name: Set extraction path facts for Payara
  ansible.builtin.set_fact:
    payara_extract_path: "{{ payara_base_path }}{{ payara_sep }}{{ payara_version_dir }}"
  when: artifacts is defined and artifacts.get('payara') is defined
  tags: [always]

- name: Set Linux specific path facts for Payara
  ansible.builtin.set_fact:
    payara_actual_path: "{{ payara_extract_path }}{{ payara_sep }}{{ payara_extract_dir }}"
  when: ansible_facts['os_family'] != 'Windows'
  tags: [always]
