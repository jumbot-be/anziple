---
- name: Setup Payara facts
  ansible.builtin.include_tasks: setup.yml
  tags: [always]

- name: Stop Payara (Linux)
  ansible.builtin.shell: |
    if [ -L {{ payara_symlink_path }} ]; then
      {{ payara_symlink_path }}/bin/asadmin stop-domain
    fi
  args:
    executable: /bin/bash
  when: ansible_facts['os_family'] != 'Windows'
  failed_when: false
  changed_when: true

- name: Stop Payara (Windows)
  ansible.windows.win_shell: |
    if (Test-Path "{{ payara_symlink_path }}") {
      & "{{ payara_symlink_path }}\bin\asadmin.bat" stop-domain
    }
  when: ansible_facts['os_family'] == 'Windows'
  failed_when: false
