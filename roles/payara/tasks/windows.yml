---
- name: Download Payara bundle
  ansible.builtin.include_role:
    name: integrity
  vars:
    integrity_artifact_url: "{{ artifacts.get('payara', {}).get('url', '') }}"
    integrity_artifact_dest: "{{ payara_bundle_dest | default('') }}"
    integrity_artifact_checksum: "{{ artifacts.get('payara', {}).get('checksum', '') }}"
    integrity_validate_certs: "{{ artifacts.get('payara', {}).get('validate_certs', true) }}"
    integrity_force_os: "{{ ansible_facts.get('os_family', 'Windows') }}"
  when: artifacts is defined and artifacts.get('payara') is defined

- name: Create versioned directory (Windows)
  ansible.windows.win_file:
    path: "{{ payara_extract_path }}"
    state: directory

- name: Extract Payara bundle (Windows)
  ansible.windows.win_shell: |
    Expand-Archive -Path "{{ payara_bundle_dest }}" -DestinationPath "{{ payara_extract_path }}_tmp" -Force
    $subDir = Get-ChildItem -Path "{{ payara_extract_path }}_tmp" -Directory | Select-Object -First 1
    Move-Item -Path "$($subDir.FullName)\*" -Destination "{{ payara_extract_path }}" -Force
    Remove-Item -Path "{{ payara_extract_path }}_tmp" -Recurse -Force

- name: Create profiles/ansible directory (Windows)
  ansible.windows.win_file:
    path: "{{ payara_extract_path }}{{ payara_sep }}profiles{{ payara_sep }}ansible"
    state: directory

- name: Template config.properties
  ansible.builtin.template:
    src: config.properties.j2
    dest: "{{ payara_extract_path }}{{ payara_sep }}profiles{{ payara_sep }}ansible{{ payara_sep }}config.properties"

- name: Run prepare-config.sh (Windows)
  ansible.windows.win_shell:
    executable: "C:\\Program Files\\Git\\usr\\bin\\bash.exe"
    cmd: "./prepare-config.sh ansible"
    chdir: "{{ payara_extract_path }}"
  environment:
    JAVA_HOME: "{{ payara_java_home | default(common_java_home) | default('') }}"
  changed_when: true

- name: Create Payara symbolic link (Windows)
  ansible.windows.win_file:
    src: "{{ payara_extract_path }}"
    dest: "{{ payara_symlink_path }}"
    state: link
    force: true

- name: Find mandatory scripts
  ansible.builtin.find:
    paths: "{{ payara_extract_path }}"
    patterns: "[1-9]*-payara--*.sh"
  register: payara_mandatory_scripts

# - name: Run mandatory scripts (Windows)
#   ansible.windows.win_shell:
#     executable: "C:\\Program Files\\Git\\usr\\bin\\bash.exe"
#     cmd: "./{{ item.path | basename }}"
#     chdir: "{{ payara_extract_path }}"
#   environment:
#     JAVA_HOME: "{{ common_java_home | default('') }}"
#   loop: "{{ payara_mandatory_scripts.files | sort(attribute='path') }}"
#   changed_when: true

- name: Verify Payara extraction (Windows)
  ansible.windows.win_stat:
    path: "{{ payara_extract_path }}\\payara5"
  register: payara_verify_stat_win

- name: Assert Payara is present (Windows)
  ansible.builtin.assert:
    that:
      - payara_verify_stat_win.stat.exists
    msg: "Payara server not found at {{ payara_extract_path }}\\payara5"
